name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup NodeJS 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: npm-ci
        run: npm ci

      - name: npm-compile
        run: npm run compile

      - name: Create reports directory
        run: mkdir -p reports

      - name: Allow unprivileged user namespace (ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: UI test (macOS, windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm run ui-test -- --mocha_config ./.mocharc-actions.js

      - name: UI test (linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run ui-test -- --mocha_config ./.mocharc-actions.js

      - name: Test Report
        uses: dorny/test-reporter@v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: UI Tests (${{ matrix.os }})
          path: reports/ui-test-results.json
          reporter: mocha-json

      - name: Store UI test logs
        uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: logs-${{ matrix.os }}
          path: ${{ runner.temp }}/test-resources/settings/logs/*

      - name: Store UI Test screenshots
        uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/test-resources/screenshots/*.png

  check:
    if: always()
    runs-on: ubuntu-latest
    name: 🚦 Status Check
    needs: [main]
    steps:
      - name: ℹ️ Test Matrix Result
        run: |
          echo result = ${{ needs.main.result }}
      - name: ✅ Status Check - success
        if: ${{ needs.main.result == 'success' }}
        run: |
          echo "All tests successfully completed!"
          exit 0
      - name: ❌ Status Check - failure
        if: ${{ needs.main.result != 'success' }}
        run: |
          echo "Status Check failed!"
          exit 1
